name: Optimize storefront images

on:
  push:
    branches: [main]
    paths:
      - '*.png'
      - 'index.html'
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp

      - name: Convert referenced PNG images to WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          refs = set(re.findall(r'(?:(?:src|content)=\"|url\()([^\"\')]+\.png)', html, flags=re.I))
          refs = {r for r in refs if Path(r).name not in {'logo.png', 'favicon.png'} and not r.startswith('http')}

          for ref in sorted(refs):
              src = Path(ref)
              if src.exists():
                  dst = src.with_suffix('.webp')
                  print(f'Optimizing {src} -> {dst}')
                  import subprocess
                  subprocess.run([
                      'convert', str(src), '-strip', '-resize', '1800x1800>',
                      '-define', 'webp:method=6', '-quality', '82', str(dst)
                  ], check=True)

          for ref in sorted(refs):
              html = html.replace(ref, str(Path(ref).with_suffix('.webp')).replace('\\', '/'))
          Path('index.html').write_text(html, encoding='utf-8')
          PY

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.webp' index.html
          if git diff --cached --quiet; then
            echo "No image optimization changes needed."
            exit 0
          fi
          git commit -m "Serve optimized WebP storefront images"
          git push
